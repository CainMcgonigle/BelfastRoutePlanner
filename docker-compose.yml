services:
  otp:
    image: docker.io/opentripplanner/opentripplanner:latest
    volumes:
      - ./otp/graphs/ni:/var/opentripplanner
    ports:
      - "8080:8080"
    command: ["--load", "--serve"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/otp/routers/default"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    volumes:
      - ./otp/graphs/ni:/data
    ports:
      - "5000:5000"
    command: osrm-routed --algorithm mld /data/northern-ireland-latest.osrm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/nearest/v1/driving/-5.9301,54.5973"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      otp:
        condition: service_healthy
    environment:
      - OTP_BASE=http://otp:8080/otp/routers/default
      - OSRM_BASE=http://osrm:5000
      - CIF_DIR=/data/cif
      - STOPS_GEOJSON=/data/translink-stops.geojson
    volumes:
      - ./data:/data
